name: Python Tests

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - ".github/workflows/python-tests.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Architecture boundaries (import-linter)
        run: lint-imports

      - name: Unit tests with coverage gate for the gRPC API
        run: >-
          pytest -m "not integration"
          --cov=aigora.curriculum_graph.presentation
          --cov=aigora.curriculum_graph.application.use_cases.read_graph
          --cov=aigora.curriculum_graph.application.services
          --cov=aigora.curriculum_graph.infrastructure.neo4j.neo4j_curriculum_graph_reader
          --cov-report=term-missing
          --cov-fail-under=80

  integration:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26.0
        env:
          NEO4J_AUTH: neo4j/ci-integration-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-integration-password 'RETURN 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      NEO4J_INTEGRATION_TESTS: "1"
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ci-integration-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Integration tests (Neo4j + gRPC)
        run: pytest -m integration -rs
