[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aigora"
version = "0.2.2"
description = "AIGORA — AI-driven mathematics learning architecture"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5.20",
    "PyYAML>=6.0",
    "grpcio==1.68.1",
    "grpcio-status==1.68.1",
    "protobuf>=5.28,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "grpcio-tools==1.68.1",
    "import-linter>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.cypher", "*.pyi"]

[tool.pytest.ini_options]
pythonpath = ["src", "tools"]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = [
    "integration: marks tests as integration tests",
]

[tool.importlinter]
root_packages = ["aigora.curriculum_graph"]

# ============================================================
# DOMAIN ISOLATION
# ============================================================

[[tool.importlinter.contracts]]
name = "Domain must remain isolated from outer layers"
type = "forbidden"
source_modules = ["aigora.curriculum_graph.domain"]

forbidden_modules = [
    # Internal architectural layers
    "aigora.curriculum_graph.application",
    "aigora.curriculum_graph.infrastructure",
    "aigora.curriculum_graph.presentation",

    # Web / Transport Protocols
    "fastapi",
    "starlette",
    "requests",
    "httpx",

    # gRPC / RPC
    "grpc",

    # Persistence / ORM
    "sqlalchemy",
    "neo4j",
    "pymongo",

    # Messaging / async infra
    "kafka",
    "redis",
    "celery",

    # Cloud SDKs
    "boto3",
]

# ============================================================
# PRESENTATION ISOLATION
# ============================================================

[[tool.importlinter.contracts]]
name = "Presentation must not bypass application layer"
type = "forbidden"
source_modules = ["aigora.curriculum_graph.presentation"]

forbidden_modules = [
    "aigora.curriculum_graph.domain",
]

# ============================================================
# OPTIONAL: Prevent infra leaking into presentation
# ============================================================

[[tool.importlinter.contracts]]
name = "Presentation must not directly depend on infrastructure"
type = "forbidden"
source_modules = ["aigora.curriculum_graph.presentation"]

forbidden_modules = [
    "aigora.curriculum_graph.infrastructure",
]

# ============================================================
# OPTIONAL: Prevent application from depending on presentation
# ============================================================

[[tool.importlinter.contracts]]
name = "Application must not depend on presentation"
type = "forbidden"
source_modules = ["aigora.curriculum_graph.application"]

forbidden_modules = [
    "aigora.curriculum_graph.presentation",
]

# ============================================================
# GENERATED gRPC CONTRACTS STAY IN THE DELIVERY LAYER (ADR-007)
# ============================================================

[[tool.importlinter.contracts]]
name = "Only presentation may use generated gRPC contracts"
type = "forbidden"
source_modules = [
    "aigora.curriculum_graph.domain",
    "aigora.curriculum_graph.application",
    "aigora.curriculum_graph.infrastructure",
]

forbidden_modules = [
    "aigora.curriculum_graph.v1",
    "google.protobuf",
]

