// Curriculum Graph read-only API — contract v1.
//
// Compatibility boundary: package aigora.curriculum_graph.v1 (ADR-007).
// Only additive changes are allowed in v1: new RPCs, new fields and new enum
// values. Never remove, rename, renumber or retype fields; reserve removed
// tags and names. Breaking changes require a new v2 package.
//
// Every successful graph-data response carries `graph_version`, including
// empty results. Failures are reported with a gRPC status plus an ErrorDetail
// (see ErrorDetail below).
syntax = "proto3";

package aigora.curriculum_graph.v1;

option java_multiple_files = true;
option java_package = "com.aigora.curriculumgraph.v1";
option java_outer_classname = "CurriculumGraphProto";

// Read-only access to the published Curriculum Graph snapshot.
service CurriculumGraphService {
  // Returns the active graph version and a summary of the served snapshot.
  rpc GetGraphMetadata(GetGraphMetadataRequest) returns (GetGraphMetadataResponse);

  // Returns a single concept by id.
  // Errors: CG_NODE_NOT_FOUND, CG_INVALID_REQUEST, CG_INVALID_GRAPH_VERSION, CG_GRAPH_UNAVAILABLE.
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);

  // Lists concepts ordered by id, optionally filtered by domain or profile.
  // Errors: CG_PROFILE_NOT_FOUND, CG_INVALID_REQUEST, CG_INVALID_GRAPH_VERSION, CG_GRAPH_UNAVAILABLE.
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);

  // Returns the direct prerequisites of a concept.
  // Errors: CG_NODE_NOT_FOUND, CG_INVALID_REQUEST, CG_INVALID_GRAPH_VERSION, CG_GRAPH_UNAVAILABLE.
  rpc GetPrerequisites(GetPrerequisitesRequest) returns (GetPrerequisitesResponse);

  // Returns the concepts to revisit when mastery of a concept breaks down.
  // Errors: CG_NODE_NOT_FOUND, CG_INVALID_REQUEST, CG_INVALID_GRAPH_VERSION, CG_GRAPH_UNAVAILABLE.
  rpc GetRegressionTargets(GetRegressionTargetsRequest) returns (GetRegressionTargetsResponse);

  // Returns the shortest prerequisite path from a start concept to a target concept.
  // An unreachable target is a success with path_found = false.
  // Errors: CG_NODE_NOT_FOUND, CG_INVALID_REQUEST, CG_INVALID_GRAPH_VERSION, CG_GRAPH_UNAVAILABLE.
  rpc GetLearningPath(GetLearningPathRequest) returns (GetLearningPathResponse);

  // Reports whether the service can answer graph queries. Never fails with a
  // graph error; an unavailable graph is reported as NOT_SERVING.
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// ---------------------------------------------------------------------------
// Shared messages
// ---------------------------------------------------------------------------

// Request metadata shared by graph-data RPCs.
message RequestContext {
  // Caller-supplied correlation id. Generated by the server when empty and
  // echoed in ErrorDetail.request_id.
  string request_id = 1;

  // Optional graph version the caller expects. Empty means "the active
  // version". A value different from the active version fails with
  // CG_INVALID_GRAPH_VERSION.
  string graph_version = 2;
}

// Mastery scale level, aligned with the domain MasteryLevel enum.
enum MasteryLevel {
  MASTERY_LEVEL_UNSPECIFIED = 0;
  MASTERY_LEVEL_UNEXPOSED = 1;
  MASTERY_LEVEL_RECOGNISES = 2;
  MASTERY_LEVEL_GUIDED = 3;
  MASTERY_LEVEL_INDEPENDENT = 4;
  MASTERY_LEVEL_EFFICIENT = 5;
  MASTERY_LEVEL_TRANSFERABLE = 6;
}

// Observable description of one mastery level for a concept.
message MasteryCriterion {
  MasteryLevel level = 1;
  string description = 2;
}

// A single atomic concept of the curriculum.
message Node {
  string id = 1;
  string name = 2;
  string domain = 3;
  string description = 4;
  // Ordered by mastery level.
  repeated MasteryCriterion mastery_criteria = 5;
  // Common misconceptions and error patterns.
  repeated string error_taxonomy = 6;
  // Ordered prerequisite node ids declared on the node.
  repeated string prerequisite_ids = 7;
  // Ordered regression node ids declared on the node.
  repeated string regression_ids = 8;
}

// Kind of prerequisite relationship.
enum PrerequisiteKind {
  PREREQUISITE_KIND_UNSPECIFIED = 0;
  // Required before attempting the dependent concept.
  PREREQUISITE_KIND_HARD = 1;
  // Strongly recommended but not strictly required.
  PREREQUISITE_KIND_SOFT = 2;
}

// Canonical error payload attached to every failed RPC as a rich status
// detail: the "grpc-status-details-bin" trailer carries a google.rpc.Status
// whose details contain exactly one ErrorDetail.
message ErrorDetail {
  // Stable canonical code, one of: CG_NODE_NOT_FOUND, CG_PROFILE_NOT_FOUND,
  // CG_INVALID_GRAPH_VERSION, CG_GRAPH_UNAVAILABLE, CG_INVALID_REQUEST.
  string code = 1;
  // Safe human-readable summary. Never contains infrastructure details.
  string message = 2;
  // Correlation id of the failed request.
  string request_id = 3;
  // Active graph version when the request was bound to a known version;
  // empty otherwise.
  string graph_version = 4;
}

// ---------------------------------------------------------------------------
// GetGraphMetadata
// ---------------------------------------------------------------------------

message GetGraphMetadataRequest {
  RequestContext context = 1;
}

message GetGraphMetadataResponse {
  string graph_version = 1;
  int32 node_count = 2;
  int32 edge_count = 3;
  int32 profile_count = 4;
  // Sorted ids of the curriculum profiles in the snapshot.
  repeated string profile_ids = 5;
  // Sorted distinct node domains in the snapshot.
  repeated string domains = 6;
}

// ---------------------------------------------------------------------------
// GetNode
// ---------------------------------------------------------------------------

message GetNodeRequest {
  RequestContext context = 1;
  string node_id = 2;
}

message GetNodeResponse {
  string graph_version = 1;
  Node node = 2;
}

// ---------------------------------------------------------------------------
// ListNodes
// ---------------------------------------------------------------------------

message ListNodesRequest {
  RequestContext context = 1;
  // Only nodes of this domain. Empty means no domain filter.
  string domain = 2;
  // Only nodes referenced by this curriculum profile. Empty means no filter.
  string profile_id = 3;
  // Maximum number of nodes to return. 0 means the server default (100);
  // values above 1000 are capped at 1000. Negative values are invalid.
  int32 page_size = 4;
  // Opaque token from a previous ListNodesResponse.next_page_token.
  string page_token = 5;
}

message ListNodesResponse {
  string graph_version = 1;
  // Ordered by node id.
  repeated Node nodes = 2;
  // Empty when there are no more results.
  string next_page_token = 3;
  // Total number of nodes matching the filters, across all pages.
  int32 total_size = 4;
}

// ---------------------------------------------------------------------------
// GetPrerequisites
// ---------------------------------------------------------------------------

message GetPrerequisitesRequest {
  RequestContext context = 1;
  string node_id = 2;
  // Include soft prerequisites. Defaults to true when unset.
  optional bool include_soft = 3;
}

message Prerequisite {
  Node node = 1;
  PrerequisiteKind kind = 2;
}

message GetPrerequisitesResponse {
  string graph_version = 1;
  repeated Prerequisite prerequisites = 2;
}

// ---------------------------------------------------------------------------
// GetRegressionTargets
// ---------------------------------------------------------------------------

message GetRegressionTargetsRequest {
  RequestContext context = 1;
  string node_id = 2;
}

message GetRegressionTargetsResponse {
  string graph_version = 1;
  // Declared regression ids first, then regression_target edges; no duplicates.
  repeated Node targets = 2;
}

// ---------------------------------------------------------------------------
// GetLearningPath
// ---------------------------------------------------------------------------

message GetLearningPathRequest {
  RequestContext context = 1;
  string start_node_id = 2;
  string target_node_id = 3;
  // Traverse soft prerequisite edges. Defaults to true when unset.
  optional bool include_soft = 4;
}

message GetLearningPathResponse {
  string graph_version = 1;
  // False when the target is unreachable from the start; `path` is then empty.
  bool path_found = 2;
  // Ordered from start to target, both included.
  repeated Node path = 3;
}

// ---------------------------------------------------------------------------
// HealthCheck
// ---------------------------------------------------------------------------

message HealthCheckRequest {}

message HealthCheckResponse {
  enum ServingStatus {
    SERVING_STATUS_UNSPECIFIED = 0;
    SERVING_STATUS_SERVING = 1;
    SERVING_STATUS_NOT_SERVING = 2;
  }
  ServingStatus status = 1;
  // Version of the loaded snapshot; empty when no graph is loaded.
  string graph_version = 2;
}
